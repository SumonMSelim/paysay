# PaySay — one-command run for local development and for judges.
#
# Usage:
#   cp .env.example .env     # fill in AWS + (optional) PayPal sandbox values
#   docker compose up --build
#
# With no PAYPAL_CLIENT_ID/PAYPAL_SECRET set, PaySay starts in demo mode with a simulated
# PayPal provider so the full voice -> agent -> invoice flow is runnable without
# a sandbox account. Provide AWS credentials for the Bedrock agent to respond.

services:
  paysay:
    build: .
    ports:
      - "${PORT:-8085}:8080"
    environment:
      # --- AWS / Bedrock (required for the agent to respond) ---
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-pro-v1:0}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-2048}

      # --- PayPal (optional; omit to run in demo/mock mode) ---
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-SANDBOX}
      PAYPAL_MERCHANT_EMAIL: ${PAYPAL_MERCHANT_EMAIL:-}
      PAYPAL_MERCHANT_NAME: ${PAYPAL_MERCHANT_NAME:-}

      # --- App ---
      PAYSAY_DEFAULT_LOCALE: ${PAYSAY_DEFAULT_LOCALE:-en-US}
      PAYSAY_SUPPORTED_LOCALES: ${PAYSAY_SUPPORTED_LOCALES:-en-US,de-DE,th-TH}
      VOICE_TTS_ENABLED: ${VOICE_TTS_ENABLED:-true}
      SERVER_ADDR: ":8080"
    restart: unless-stopped
